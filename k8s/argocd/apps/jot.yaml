apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd-image-updater.argoproj.io/image-list: jot=ghcr.io/nechja/aegis-jot
    argocd-image-updater.argoproj.io/jot.update-strategy: newest-build
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nechja/aegis-public.git
    targetRevision: main
    path: k8s/workloads/jot
  destination:
    server: https://kubernetes.default.svc
    namespace: workloads
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
