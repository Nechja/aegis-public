apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nechja/aegis-public.git
    targetRevision: main
    path: k8s/workloads/collector
  destination:
    server: https://kubernetes.default.svc
    namespace: workloads
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
