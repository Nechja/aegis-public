apiVersion: apps/v1
kind: Deployment
metadata:
  name: glist
  namespace: workloads
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glist
  template:
    metadata:
      labels:
        app: glist
      annotations:
        linkerd.io/inject: disabled
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: glist
          image: ghcr.io/nechja/aegis-glist:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: glist-config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
