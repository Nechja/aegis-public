apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  # Secrets are managed out-of-band and omitted from this public mirror.
  # The deployment expects a GHCR image-pull secret and RabbitMQ credentials;
  # provide your own (e.g. SealedSecrets) and add them here:
  #   - sealed-ghcr-pull.yaml
  #   - sealed-rabbitmq-creds.yaml
