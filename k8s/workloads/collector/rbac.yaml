apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-collector
  namespace: workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegis-collector
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-collector
subjects:
  - kind: ServiceAccount
    name: aegis-collector
    namespace: workloads
roleRef:
  kind: ClusterRole
  name: aegis-collector
  apiGroup: rbac.authorization.k8s.io
