apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  # Secrets are managed out-of-band and omitted from this public mirror.
  # The deployment expects a GHCR image-pull secret; provide your own
  # (e.g. SealedSecrets) and add it here:
  #   - sealed-ghcr-pull.yaml
